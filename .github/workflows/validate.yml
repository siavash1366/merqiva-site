name: Validate Merqiva

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -e
          find . -type f -name '*.js' -not -path './node_modules/*' -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done
      - name: Check required public pages
        shell: bash
        run: |
          test -f index.html
          test -f privacy.html
          test -f terms.html
          test -f admin/operations.html
          test -f functions/api/signals/ingest.js
          test -f functions/api/admin/monitoring.js
          test -f functions/api/admin/guarantee.js
          test -f functions/api/admin/research.js
          test -f functions/api/admin/system-check.js
          test -f functions/api/research/callback.js
          test -f admin/operations.js
          test -f admin/operations.css
          test -f n8n/Merqiva_AI_Maritime_Research_Agent_MVP.json
      - name: Validate n8n workflow JSON
        shell: bash
        run: node -e "const fs=require('fs'); const w=JSON.parse(fs.readFileSync('n8n/Merqiva_AI_Maritime_Research_Agent_MVP.json','utf8')); if(!Array.isArray(w.nodes)||!w.connections) throw new Error('Invalid n8n workflow shape'); console.log('n8n workflow JSON OK');"

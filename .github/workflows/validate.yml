name: Validate Merqiva

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -e
          find . -type f -name '*.js' -not -path './node_modules/*' -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done
      - name: Check required product files
        shell: bash
        run: |
          set -e
          test -f index.html
          test -f 404.html
          test -f privacy.html
          test -f terms.html
          test -f _headers
          test -f robots.txt
          test -f sitemap.xml
          test -f admin/index.html
          test -f admin/campaigns.html
          test -f admin/campaigns.js
          test -f admin/campaign-audience.html
          test -f admin/campaign-audience.js
          test -f admin/operations.html
          test -f admin/opportunities.html
          test -f admin/performance.css
          test -f admin/performance.js
          test -f admin/performance.html
          test -f functions/api/contact.js
          test -f functions/api/health.js
          test -f functions/api/signals/ingest.js
          test -f functions/api/admin/monitoring.js
          test -f functions/api/admin/guarantee.js
          test -f functions/api/admin/billing.js
          test -f functions/api/admin/guarantee-claim.js
          test -f functions/api/admin/metrics.js
          test -f functions/api/admin/opportunity-outcome.js
          test -f functions/api/admin/opportunity-action.js
          test -f functions/api/admin/research.js
          test -f functions/api/admin/system-check.js
          test -f functions/api/research/callback.js
          test -f functions/api/webhooks/resend.js
          test -f admin/operations.js
          test -f admin/operations.css
          test -f admin/opportunities.js
          test -f admin/opportunities.css
          test -f n8n/Merqiva_AI_Maritime_Research_Agent_MVP.json
          test -f n8n/Merqiva_Website_Lead_Telegram_Alert.json
          test -f docs/MERQIVA_N8N_HANDOFF.md
      - name: Validate public HTML contracts
        shell: bash
        run: |
          set -e
          grep -Eq '<title>[^<]*Merqiva' index.html
          grep -q 'id="contact"' index.html
          grep -q 'action="/api/contact"' index.html
          grep -q 'href="/styles.css"' index.html
          grep -q '<meta name="description"' index.html
          grep -q '<title>Privacy | Merqiva' privacy.html
          grep -q '<title>Service Terms | Merqiva' terms.html
      - name: Validate n8n workflow JSON
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const files=fs.readdirSync('n8n').filter(name=>name.endsWith('.json'));
          if(!files.length) throw new Error('No n8n workflow JSON files found');
          for(const name of files){
            const file=path.join('n8n',name);
            const w=JSON.parse(fs.readFileSync(file,'utf8'));
            if(!Array.isArray(w.nodes)||!w.connections) throw new Error(`Invalid n8n workflow shape: ${file}`);
            console.log(`n8n workflow JSON OK: ${file}`);
          }
          NODE
      - name: Validate security headers file
        shell: bash
        run: |
          set -e
          grep -q 'X-Content-Type-Options: nosniff' _headers
          grep -q 'X-Frame-Options: DENY' _headers
          grep -q 'Content-Security-Policy:' _headers

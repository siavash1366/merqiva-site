<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Merqiva Admin</title>


<style>

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f8fafc;
  margin:0;
  padding:30px;
  color:#111827;
}


.container{
  max-width:1200px;
  margin:auto;
}


.card{
  background:white;
  border:1px solid #e5e7eb;
  border-radius:10px;
  padding:20px;
  margin-bottom:20px;
}


input,button{
  padding:10px;
  border-radius:6px;
  border:1px solid #d1d5db;
}


button{
  cursor:pointer;
  background:#0b1220;
  color:white;
}


table{
  width:100%;
  border-collapse:collapse;
}


th,td{
  padding:12px;
  border-bottom:1px solid #e5e7eb;
  text-align:left;
}


.hidden{
  display:none;
}


.status{
  padding:4px 8px;
  border-radius:5px;
  background:#e5e7eb;
}

</style>

</head>


<body>


<div class="container">


<div class="card" id="loginBox">

<h2>
Merqiva Admin Login
</h2>


<input
id="token"
type="password"
placeholder="Admin Token"
style="width:300px;"
>


<button onclick="login()">
Login
</button>


<p id="loginError"></p>


</div>





<div class="card hidden" id="panel">


<h2>
Lead Management
</h2>


<button onclick="logout()">
Logout
</button>


<div id="table"></div>


</div>


</div>





<script>


let token =
localStorage.getItem(
"merqiva_admin_token"
);



if(token){

 loadLeads();

}





function login(){


const value =
document
.getElementById("token")
.value
.trim();



if(!value)
return;



localStorage.setItem(
"merqiva_admin_token",
value
);


token=value;


loadLeads();


}






async function loadLeads(){


try{


const res =
await fetch(
"/api/admin/leads",
{

headers:{
Authorization:
"Bearer " + token
}

}
);



const data =
await res.json();



if(!data.success){


throw new Error(
data.error
);


}




document
.getElementById("loginBox")
.classList
.add("hidden");



document
.getElementById("panel")
.classList
.remove("hidden");



renderLeads(
data.leads
);



}
catch(error){


localStorage.removeItem(
"merqiva_admin_token"
);


document
.getElementById("loginError")
.innerText =
"Invalid token";


}



}






function renderLeads(
leads
){


let html = `

<table>

<tr>

<th>ID</th>
<th>Name</th>
<th>Company</th>
<th>Email</th>
<th>Status</th>
<th>Date</th>

</tr>

`;



for(
const lead of leads
){


html += `

<tr>

<td>
${lead.id}
</td>


<td>
${lead.name}
</td>


<td>
${lead.company}
</td>


<td>
${lead.email}
</td>


<td>

<span class="status">
${lead.status}
</span>

</td>


<td>
${lead.createdAt}
</td>


</tr>

`;

}



html += "</table>";



document
.getElementById("table")
.innerHTML =
html;


}







function logout(){


localStorage.removeItem(
"merqiva_admin_token"
);


location.reload();


}



</script>


</body>

</html>

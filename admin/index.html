<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merqiva CRM Admin</title>
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
<div class="container">
<div id="loginBox" class="card">
<h1>Merqiva CRM Login</h1>
<input id="token" type="password" placeholder="Admin Token" />
<button id="loginBtn">Login</button>
<div id="loginError" class="message"></div>
</div>

<div id="panel" class="hidden">
<div class="card">
<h1>Lead Management</h1>
<div class="toolbar">
<button id="refreshBtn">Refresh</button>
<button id="logoutBtn">Logout</button>
<button type="button" onclick="window.location.href='/admin/opportunities.html'">Opportunity Intelligence</button>
</div>
</div>

<div class="card">
<h2>Search &amp; Filter</h2>
<input id="searchInput" type="text" placeholder="Search name, email, company..." />
<select id="statusFilter">
<option value="">All Status</option>
<option value="New">New</option>
<option value="Reviewed">Reviewed</option>
<option value="Contacted">Contacted</option>
<option value="Qualified">Qualified</option>
<option value="Proposal Sent">Proposal Sent</option>
<option value="Won">Won</option>
<option value="Lost">Lost</option>
</select>
<button id="searchBtn">Search</button>
</div>

<div class="card">
<h2>Campaign Management</h2>
<div class="campaign-form">
<input id="campaignName" type="text" placeholder="Campaign Name" />
<input id="campaignSubject" type="text" placeholder="Email Subject" />
<textarea id="campaignBody" placeholder="Email Content"></textarea>
<button id="createCampaignBtn">Create Campaign</button>
</div>
<h3>Campaign List</h3>
<table>
<thead><tr><th>ID</th><th>Name</th><th>Subject</th><th>Status</th><th>Action</th></tr></thead>
<tbody id="campaignTable"></tbody>
</table>

<table>
<tbody id="leadTable"></tbody>
</table>

<div class="pagination">
<button id="prevPage">Previous</button>
<span id="pageInfo">Page 1</span>
<button id="nextPage">Next</button>
</div>
</div>

<div id="leadDetails" class="card hidden">
<h2>Lead Details</h2>
<div id="detailsContent"></div>
<div class="noteBox">
<h3>Internal Notes</h3>
<textarea id="noteInput" placeholder="Add internal note..."></textarea>
<button id="saveNoteBtn">Save Note</button>
<div id="notesList"></div>
</div>
<h3>Activity History</h3>
<div id="historyContent"></div>
<div class="detailActions">
<button id="replyBtn">Reply Email</button>
<button id="copyEmailBtn">Copy Email</button>
<button id="closeDetails">Close</button>
</div>
</div>
</div>
</div>
<script src="/admin/admin.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Merqiva Admin</title>

<link rel="stylesheet" href="/admin/admin.css">

</head>


<body>


<div class="container">


<div id="loginBox" class="card">

<h1>Merqiva Admin Login</h1>

<input
id="token"
type="password"
placeholder="Admin Token"
/>

<button id="loginBtn">
Login
</button>


<div id="loginError" class="message"></div>


</div>




<div id="panel" class="hidden">


<div class="card">

<h1>
Lead Management
</h1>


<button id="refreshBtn">
Refresh Leads
</button>


<button id="logoutBtn">
Logout
</button>


</div>




<div class="card">


<h2>
Website Leads
</h2>


<table>


<thead>

<tr>

<th>ID</th>
<th>Name</th>
<th>Email</th>
<th>Company</th>
<th>Country</th>
<th>Offering</th>
<th>Status</th>
<th>Action</th>

</tr>

</thead>


<tbody id="leadTable">

</tbody>


</table>


</div>


</div>


</div>



<script src="/admin/admin.js"></script>


</body>

</html>

<!-- admin/campaign-audience.html -->

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Campaign Audience</title>

<link rel="stylesheet" href="/admin/admin.css">

</head>


<body>


<div class="container">



<!-- CAMPAIGN SELECT -->

<div class="card">


<h1>
Campaign Audience
</h1>



<p>
Select Campaign
</p>


<select id="campaignSelect">

<option value="">
Select Campaign
</option>


</select>



</div>






<!-- FILTER -->

<div class="card">


<h2>
Lead Filter
</h2>



<input

id="searchAudience"

type="text"

placeholder="Search name, email, company"

/>





<select id="countryFilter">


<option value="">
All Countries
</option>


</select>






<select id="statusFilter">


<option value="">
All Status
</option>


<option value="New">
New
</option>


<option value="Reviewed">
Reviewed
</option>


<option value="Contacted">
Contacted
</option>


<option value="Qualified">
Qualified
</option>


<option value="Proposal Sent">
Proposal Sent
</option>


<option value="Won">
Won
</option>


<option value="Lost">
Lost
</option>



</select>





<button id="filterBtn">

Filter

</button>



</div>








<!-- RECIPIENT TABLE -->


<div class="card">


<h2>
Select Recipients
</h2>



<table>


<thead>


<tr>


<th>
Select
</th>


<th>
Name
</th>


<th>
Email
</th>


<th>
Company
</th>


<th>
Country
</th>


<th>
Status
</th>


</tr>


</thead>




<tbody id="audienceTable">


</tbody>



</table>





<br>



<div class="toolbar">


<button id="saveAudienceBtn">

Save Audience

</button>


</div>



</div>







<!-- COUNTER -->


<div class="card">


<h3>

Selected Leads:

<span id="selectedCount">
0
</span>


</h3>


</div>







</div>





<script src="/admin/campaign-audience.js"></script>


</body>

</html>
